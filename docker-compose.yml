services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: anivexa-dev-server:latest
    container_name: anivexa-dev-server
    restart: unless-stopped
    ports:
      - "${PORT:-4000}:4000"
    environment:
      - PORT=4000
      - BASE_PATH=${BASE_PATH:-}
      - NODE_ENV=production
    env_file:
      - .env
    volumes:
      - ./docs:/app/docs:ro
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:4000/",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
